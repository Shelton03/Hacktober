{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white border rounded-lg p-6">
  <h1 class="text-xl font-bold mb-1">Log in</h1>
  <p class="text-sm text-slate-500 mb-4">Email or phone + password</p>
  <form method="post" class="space-y-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="w-full bg-blue-600 text-white rounded px-4 py-2 font-medium hover:bg-blue-700">Log in</button>
  </form>
  <p class="text-sm mt-4 text-slate-500">No account? <a class="text-blue-600" href="{% url 'accounts:signup' %}">Sign up</a></p>
</div>
{% endblock %}
